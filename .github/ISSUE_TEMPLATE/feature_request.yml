name: Feature Request
description: Request a new feature to help improve the integration
labels: ["enhancement"]
assignees:
  - BottlecapDave
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: Please provide a clear and concise description of what the feature is
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Please provide a clear and concise description of what you expected to happen
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: Please provide a use case for this new feature so that I can better understand the problem that is being solved
    validations:
      required: true
  - type: checkboxes
    id: docs
    attributes:
      label: Confirmation
      options:
        - label: By submitting this feature request, you agree that you have read the [documentation](https://bottlecapdave.github.io/HomeAssistant-OctopusEnergy) and confirmed it does not already exist
          required: true
        - label: I am willing/able to help contribute to the solution of this feature
  - type: checkboxes
    id: ai-triage-consent
    attributes:
      label: AI Triage
      description: >-
        This repository uses an AI assistant to help triage new issues (for example, suggesting relevant GraphQL
        API endpoints that could implement the feature). This is optional - if you don't consent, your issue is
        your issue is still triaged by the maintainer as normal, just without the automated help.
      options:
        - label: I consent to this issue, including any text I provide, being processed by an AI assistant for automated triage
