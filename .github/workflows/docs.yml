name: Docs
on:
  workflow_dispatch:
  push:
    paths:
      - 'mkdocs.yml'
      - '_docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  build_docs:
    if: ${{ (github.repository_owner == 'BottlecapDave' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')) == false }}
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            _docs
      - name: asdf_install
        uses: asdf-vm/actions/install@v4
      - run: pip install -r requirements.txt
      - run: zensical build --clean --strict

  deploy_docs:
    if: ${{ github.repository_owner == 'BottlecapDave' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    name: Deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            _docs
      - name: asdf_install
        uses: asdf-vm/actions/install@v4
      - run: pip install -r requirements.txt
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
